# Vorlage für den Homelab-Compose-Stack. Das fertige Image baut GitHub
# Actions bei jedem Push auf main (amd64 und arm64); ein Volume braucht drop
# nicht, weil nichts gespeichert wird.
#
# Lieber selbst aus dem Quellcode bauen? Statt der image-Zeile:
#   build: https://github.com/doenke/drop.git#main

services:
  drop:
    image: ghcr.io/doenke/drop:latest
    container_name: drop
    restart: unless-stopped
    env_file: .env
    ports:
      - "8080:8080"
    networks:
      - bridge-net
    healthcheck:
      # Das Image ist distroless und hat weder Shell noch curl; das Binary
      # prüft sich deshalb selbst per -healthcheck-Flag gegen /healthz.
      test: ["CMD", "/drop", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  bridge-net:
    external: true
